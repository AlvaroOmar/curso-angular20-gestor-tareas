<main>
  <h1>{{ title }}</h1>
  <p class="contador">Pendientes: {{ tasksService.pendientes() }}</p>

  <div class="nueva-tarea">
    <app-task-form (agregado)="tasksService.agregar($event)" />
    <button
      (click)="tasksService.limpiarCompletadas()"
      [disabled]="tasksService.completadas() === 0"
    >
      Limpiar tareas completadas
    </button>
  </div>

  <ul>
    @for (tarea of tasksService.tareas(); track tarea.id) {
    <app-task-item
      [task]="tarea"
      (toggle)="tasksService.toggle($event)"
      (removed)="tasksService.eliminar($event)"
    />
    } @empty {
    <li>No hay tareas. Agrega una!!</li>
    }
  </ul>
</main>

<router-outlet />
